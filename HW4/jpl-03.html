<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文動物翻面單字卡</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 20px 48px;
      font-family: "Noto Sans JP", "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fff6 0%, #e5f7e8 100%);
      color: #333;
      text-align: center;
    }

    /* 回首頁按鈕 */
    .home-btn{
      position: fixed;
      top: 18px;
      left: 18px;
      background: rgba(255,255,255,0.95);
      color: #2d6a4f;
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      transition: transform 0.2s ease, background 0.2s ease;
      z-index: 999;
    }

    .home-btn:hover{
      background: #eefbf3;
      transform: translateY(-2px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 42px;
      color: #2d6a4f;
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 18px;
      color: #4c6b5d;
      line-height: 1.6;
    }

    .speed-control {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 0 20px;
      padding: 10px 14px;
      background: #fff;
      border: 2px solid #a7d7b7;
      border-radius: 999px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      color: #35624a;
      font-size: 15px;
    }

    .speed-label {
      font-weight: 700;
      margin-right: 4px;
    }

    .speed-btn {
      margin: 0;
      padding: 8px 14px;
      border-radius: 999px;
      border: 2px solid #52b788;
      background: #ffffff;
      color: #2d6a4f;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .speed-btn:hover {
      transform: translateY(-1px);
      background: #eefbf3;
    }

    .speed-btn.active {
      background: #52b788;
      color: #ffffff;
    }

    .tips {
      display: inline-block;
      margin-bottom: 28px;
      padding: 10px 18px;
      background: #fff;
      border-radius: 999px;
      border: 2px solid #a7d7b7;
      font-size: 15px;
      color: #35624a;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .card-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 22px;
    }

    .flip-card {
      background: transparent;
      perspective: 1000px;
      height: 300px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.7s;
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front,
    .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 22px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 10px 22px rgba(0,0,0,0.12);
      border: 3px solid #95d5b2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .flip-card-front {
      background: #ffffff;
    }

    .flip-card-back {
      background: linear-gradient(180deg, #ffffff 0%, #ecfff3 100%);
      transform: rotateY(180deg);
    }

    .animal-emoji {
      font-size: 68px;
      margin-bottom: 14px;
      line-height: 1;
    }

    .animal-zh {
      font-size: 30px;
      font-weight: 700;
      color: #2d6a4f;
      margin-bottom: 10px;
    }

    .front-label {
      font-size: 14px;
      color: #73957f;
      letter-spacing: 1px;
    }

    .animal-jp {
      font-size: 30px;
      font-weight: 700;
      color: #1f5c43;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .animal-kana {
      font-size: 22px;
      color: #444;
      margin-bottom: 10px;
    }

    .animal-en {
      font-size: 14px;
      color: #6f7f75;
      font-style: italic;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .speak-btn {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 15px;
      background: #52b788;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .speak-btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .speak-btn:active {
      transform: translateY(0);
    }

    .footer-note {
      margin-top: 32px;
      font-size: 14px;
      color: #6d8578;
    }

  </style>
</head>
<body>

<a href="index.html" class="home-btn">🏠 回首頁</a>

<h1>日文動物翻面單字卡</h1>
<p class="subtitle">
  正面看動物與中文，點一下卡片即可翻到背面，查看日文、假名與發音。
</p>

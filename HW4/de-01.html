<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>德文練習單字卡</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Arial", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #eef4ff 0%, #f8fbff 100%);
      color: #1f2a44;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(31, 42, 68, 0.15);
      padding: 28px 20px 32px;
    }

    .title {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      color: #5b6785;
      margin-bottom: 24px;
      line-height: 1.7;
      font-size: 1rem;
    }

    .progress {
      text-align: center;
      font-size: 1rem;
      color: #42506b;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .card-wrap {
      perspective: 1200px;
      width: 100%;
      max-width: 640px;
      height: 380px;
      margin: 0 auto 24px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s ease;
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
    }

    .front {
      background: linear-gradient(135deg, #5f8fff 0%, #7aa8ff 100%);
      color: #fff;
    }

    .back {
      background: linear-gradient(135deg, #ffffff 0%, #eef3ff 100%);
      color: #1f2a44;
      transform: rotateY(180deg);
      border: 1px solid #d7e2ff;
    }

    .label {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    .sentence {
      font-size: 2rem;
      line-height: 1.5;
      font-weight: 700;
      margin-bottom: 16px;
      word-break: break-word;
    }

    .translation {
      font-size: 1.2rem;
      line-height: 1.8;
      color: #31405f;
      max-width: 90%;
    }

    .hint {
      margin-top: 18px;
      font-size: 0.95rem;
      opacity: 0.85;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 14px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      background: #5f8fff;
      color: white;
      box-shadow: 0 8px 20px rgba(95, 143, 255, 0.25);
    }

    button:hover {
      transform: translateY(-2px);
    }

    button.secondary {
      background: #eef3ff;
      color: #335;
      box-shadow: none;
      border: 1px solid #dbe5ff;
    }

    .footer-note {
      text-align: center;
      color: #6b7692;
      font-size: 0.95rem;
      line-height: 1.7;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .app {
        padding: 22px 14px 26px;
      }

      .title {
        font-size: 1.6rem;
      }

      .subtitle {
        font-size: 0.95rem;
      }

      .card-wrap {
        height: 330px;
      }

      .sentence {
        font-size: 1.5rem;
      }

      .translation {
        font-size: 1.05rem;
      }

      button {
        width: calc(50% - 8px);
        min-width: 130px;
      }
    }

    @media (max-width: 480px) {
      .card-wrap {
        height: 300px;
      }

      .sentence {
        font-size: 1.28rem;
      }

      .translation {
        font-size: 0.98rem;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="title">德文練習單字卡</div>
    <div class="subtitle">
      點擊卡片可翻面，按下按鈕可切換卡片或播放德文朗讀。
    </div>

    <div class="progress" id="progress">第 1 張 / 共 8 張</div>

    <div class="card-wrap">
      <div class="card" id="flashcard" onclick="flipCard()">
        <div class="card-face front">
          <div class="label">Deutsch</div>
          <div class="sentence" id="frontText">Guten Morgen.</div>
          <div class="hint">點一下翻到背面</div>
        </div>
        <div class="card-face back">
          <div class="label">中文意思</div>
          <div class="translation" id="backText">早安。</div>
          <div class="hint">再點一下可翻回正面</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="secondary" onclick="prevCard()">上一張</button>
      <button onclick="speakGerman()">朗讀德文</button>
      <button class="secondary" onclick="nextCard()">下一張</button>
      <button class="secondary" onclick="randomCard()">隨機抽卡</button>
    </div>

    <div class="footer-note">
      這是純 HTML、CSS、JavaScript 製作，可直接放在 GitHub Pages 使用。<br>
      若瀏覽器支援 Web Speech API，將可播放德文語音。
    </div>
  </div>

  <script>
    const cards = [
      {
        german: "Guten Morgen.",
        chinese: "早安。"
      },
      {
        german: "Wie geht es dir?",
        chinese: "你最近好嗎？"
      },
      {
        german: "Ich heiße Anna.",
        chinese: "我叫 Anna。"
      },
      {
        german: "Ich komme aus Taiwan.",
        chinese: "我來自台灣。"
      },
      {
        german: "Heute ist das Wetter schön.",
        chinese: "今天天氣很好。"
      },
      {
        german: "Ich lerne gern Deutsch.",
        chinese: "我很喜歡學德文。"
      },
      {
        german: "Kannst du mir helfen?",
        chinese: "你可以幫我嗎？"
      },
      {
        german: "Auf Wiedersehen.",
        chinese: "再見。"
      }
    ];

    let currentIndex = 0;
    const flashcard = document.getElementById("flashcard");
    const frontText = document.getElementById("frontText");
    const backText = document.getElementById("backText");
    const progress = document.getElementById("progress");

    function renderCard() {
      frontText.textContent = cards[currentIndex].german;
      backText.textContent = cards[currentIndex].chinese;
      progress.textContent = `第 ${currentIndex + 1} 張 / 共 ${cards.length} 張`;
      flashcard.classList.remove("flipped");
    }

    function flipCard() {
      flashcard.classList.toggle("flipped");
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % cards.length;
      renderCard();
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + cards.length) % cards.length;
      renderCard();
    }

    function randomCard() {
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * cards.length);
      } while (newIndex === currentIndex && cards.length > 1);
      currentIndex = newIndex;
      renderCard();
    }

    function speakGerman() {
      const text = cards[currentIndex].german;

      if (!("speechSynthesis" in window)) {
        alert("此瀏覽器不支援語音朗讀功能。");
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "de-DE";
      utterance.rate = 0.95;
      utterance.pitch = 1;

      const voices = window.speechSynthesis.getVoices();
      const germanVoice = voices.find(voice => voice.lang.toLowerCase().includes("de"));
      if (germanVoice) {
        utterance.voice = germanVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.getVoices();
    };

    renderCard();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>德文練習單字卡</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Arial", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #3a2a00 0%, #8b6a00 40%, #fff1b8 100%);
      color: #2b1b00;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      background: linear-gradient(180deg,#fffdf5,#fff6d6);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(120,90,0,0.35);
      padding: 28px 20px 32px;
      border: 2px solid #d4af37;
    }

    .title {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #7a5200;
    }

    .subtitle {
      text-align: center;
      color: #7b5b00;
      margin-bottom: 24px;
      line-height: 1.7;
      font-size: 1rem;
    }

    .progress {
      text-align: center;
      font-size: 1rem;
      color: #6a4d00;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .card-wrap {
      perspective: 1200px;
      width: 100%;
      max-width: 640px;
      height: 380px;
      margin: 0 auto 24px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s ease;
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px;
      text-align: center;
    }

    .front {
      background: linear-gradient(135deg, #d4af37 0%, #f6d365 50%, #fff6c0 100%);
      color: #3a2a00;
      border: 2px solid #caa22a;
      box-shadow: inset 0 0 25px rgba(255,255,255,0.6);
    }

    .back {
      background: linear-gradient(135deg, #fff8e1 0%, #ffe9a3 100%);
      color: #3a2a00;
      transform: rotateY(180deg);
      border: 2px solid #caa22a;
    }

    .label {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-bottom: 14px;
      letter-spacing: 1px;
      color: #7a5200;
    }

    .sentence {
      font-size: 2rem;
      line-height: 1.5;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .translation {
      font-size: 1.2rem;
      line-height: 1.8;
      color: #5a4300;
      max-width: 90%;
    }

    .hint {
      margin-top: 18px;
      font-size: 0.95rem;
      opacity: 0.85;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 14px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg,#d4af37,#f6d365);
      color: #3a2a00;
      box-shadow: 0 6px 18px rgba(120,90,0,0.35);
    }

    button.secondary {
      background: #fff4cc;
      border: 1px solid #d4af37;
    }

    @media (max-width:768px){
      .card-wrap{
        height:330px;
      }
      .sentence{
        font-size:1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="title">德文練習單字卡</div>
    <div class="subtitle">
      點擊卡片可翻面，按下按鈕可切換卡片或播放德文朗讀
    </div>

    <div class="progress" id="progress">第 1 張 / 共 8 張</div>

    <div class="card-wrap">
      <div class="card" id="flashcard" onclick="flipCard()">
        <div class="card-face front">
          <div class="label">Deutsch</div>
          <div class="sentence" id="frontText">Guten Morgen.</div>
          <div class="hint">點擊翻面</div>
        </div>

        <div class="card-face back">
          <div class="label">中文意思</div>
          <div class="translation" id="backText">早安。</div>
          <div class="hint">再點一次返回</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="secondary" onclick="prevCard()">上一張</button>
      <button onclick="speakGerman()">朗讀</button>
      <button class="secondary" onclick="nextCard()">下一張</button>
      <button class="secondary" onclick="randomCard()">隨機</button>
    </div>
  </div>

<script>
const cards = [
{german:"Guten Morgen.",chinese:"早安"},
{german:"Wie geht es dir?",chinese:"你好嗎"},
{german:"Ich heiße Anna.",chinese:"我叫Anna"},
{german:"Ich komme aus Taiwan.",chinese:"我來自台灣"},
{german:"Heute ist das Wetter schön.",chinese:"今天天氣很好"},
{german:"Ich lerne gern Deutsch.",chinese:"我喜歡學德文"},
{german:"Kannst du mir helfen?",chinese:"你可以幫我嗎"},
{german:"Auf Wiedersehen.",chinese:"再見"}
];

let currentIndex=0;
const flashcard=document.getElementById("flashcard");
const frontText=document.getElementById("frontText");
const backText=document.getElementById("backText");
const progress=document.getElementById("progress");

function renderCard(){
frontText.textContent=cards[currentIndex].german;
backText.textContent=cards[currentIndex].chinese;
progress.textContent=`第 ${currentIndex+1} 張 / 共 ${cards.length} 張`;
flashcard.classList.remove("flipped");
}

function flipCard(){
flashcard.classList.toggle("flipped");
}

function nextCard(){
currentIndex=(currentIndex+1)%cards.length;
renderCard();
}

function prevCard(){
currentIndex=(currentIndex-1+cards.length)%cards.length;
renderCard();
}

function randomCard(){
currentIndex=Math.floor(Math.random()*cards.length);
renderCard();
}

function speakGerman(){
const utterance=new SpeechSynthesisUtterance(cards[currentIndex].german);
utterance.lang="de-DE";
speechSynthesis.speak(utterance);
}

renderCard();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語平假名大挑戰</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Noto Sans JP", "Noto Sans TC", Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
    color: #4a2c3a;
    background: linear-gradient(to bottom, #fff8fb 0%, #ffeef5 45%, #fdf6ff 100%);
    overflow-x: hidden;
    min-height: 100vh;
    position: relative;
}

/* 飄落櫻花背景 */
.sakura-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.sakura {
    position: absolute;
    top: -40px;
    font-size: 18px;
    opacity: 0.75;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

.sakura:nth-child(1)  { left: 5%;  animation-duration: 11s; animation-delay: 0s; }
.sakura:nth-child(2)  { left: 12%; animation-duration: 13s; animation-delay: 2s; }
.sakura:nth-child(3)  { left: 20%; animation-duration: 9s;  animation-delay: 1s; }
.sakura:nth-child(4)  { left: 28%; animation-duration: 15s; animation-delay: 4s; }
.sakura:nth-child(5)  { left: 36%; animation-duration: 12s; animation-delay: 3s; }
.sakura:nth-child(6)  { left: 45%; animation-duration: 10s; animation-delay: 5s; }
.sakura:nth-child(7)  { left: 54%; animation-duration: 14s; animation-delay: 1.5s; }
.sakura:nth-child(8)  { left: 63%; animation-duration: 11s; animation-delay: 6s; }
.sakura:nth-child(9)  { left: 72%; animation-duration: 13s; animation-delay: 2.5s; }
.sakura:nth-child(10) { left: 80%; animation-duration: 10s; animation-delay: 4.5s; }
.sakura:nth-child(11) { left: 88%; animation-duration: 12s; animation-delay: 1s; }
.sakura:nth-child(12) { left: 95%; animation-duration: 14s; animation-delay: 3.5s; }

@keyframes fall {
    0% {
        transform: translateY(-40px) translateX(0) rotate(0deg);
        opacity: 0;
    }
    10% {
        opacity: 0.8;
    }
    50% {
        transform: translateY(50vh) translateX(20px) rotate(180deg);
        opacity: 0.9;
    }
    100% {
        transform: translateY(110vh) translateX(-20px) rotate(360deg);
        opacity: 0;
    }
}

/* 主內容 */
.page-wrap {
    position: relative;
    z-index: 1;
    padding: 24px 16px 40px;
}

.home-btn {
    position: fixed;
    top: 18px;
    left: 18px;
    background: rgba(255, 255, 255, 0.95);
    color: #7a445a;
    padding: 10px 16px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    box-shadow: 0 6px 16px rgba(160, 110, 130, 0.18);
    transition: transform 0.2s ease, background 0.2s ease;
    z-index: 10;
}

.home-btn:hover {
    background: #fff0f6;
    transform: translateY(-2px);
}

.header-box {
    max-width: 760px;
    margin: 48px auto 20px;
    padding: 28px 20px 22px;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid rgba(255, 210, 225, 0.7);
    border-radius: 24px;
    box-shadow: 0 10px 28px rgba(190, 140, 160, 0.12);
    backdrop-filter: blur(4px);
}

h1 {
    font-size: 2.5rem;
    letter-spacing: 3px;
    margin: 0 0 10px;
    color: #d14d72;
}

.subtitle {
    margin: 0;
    font-size: 1.06rem;
    color: #7a5c68;
    line-height: 1.8;
}

.info-panel {
    max-width: 760px;
    margin: 0 auto 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.info-box, .control-box {
    background: rgba(255, 255, 255, 0.88);
    border-radius: 18px;
    padding: 14px 18px;
    box-shadow: 0 8px 20px rgba(190, 140, 160, 0.10);
    border: 1px solid rgba(255, 220, 230, 0.8);
}

.info-box {
    font-size: 1.1rem;
    color: #b03060;
    font-weight: 700;
    min-width: 180px;
}

button {
    padding: 11px 20px;
    font-size: 1rem;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff8fb1, #f46f96);
    color: white;
    font-weight: 700;
    box-shadow: 0 8px 16px rgba(244, 111, 150, 0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 20px rgba(244, 111, 150, 0.30);
}

.board-wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 22px 18px 28px;
    background: rgba(255, 255, 255, 0.82);
    border-radius: 26px;
    box-shadow: 0 14px 32px rgba(190, 140, 160, 0.14);
    border: 1px solid rgba(255, 220, 230, 0.85);
}

.game-board {
    display: grid;
    grid-template-columns: repeat(4, 110px);
    gap: 14px;
    justify-content: center;
    margin: 0 auto;
}

.card {
    width: 110px;
    height: 110px;
    background: linear-gradient(135deg, #fff7fa, #ffe5ef);
    color: transparent;
    font-size: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    border-radius: 18px;
    border: 2px solid #f7aac2;
    user-select: none;
    transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    box-shadow: 0 6px 14px rgba(220, 150, 175, 0.12);
    font-weight: 700;
}

.card:hover {
    transform: scale(1.05);
}

.card.flipped,
.card.matched {
    color: #7a3752;
    background: #ffffff;
}

.card.matched {
    background: linear-gradient(135deg, #fff8d8, #fff1b8);
    border-color: #f1c95d;
    cursor: default;
}

.tip {
    margin-top: 18px;
    font-size: 0.95rem;
    color: #8b6b77;
    line-height: 1.8;
}

@media (max-width: 640px) {
    .header-box {
        margin-top: 70px;
    }

    h1 {
        font-size: 1.9rem;
        letter-spacing: 2px;
    }

    .subtitle {
        font-size: 0.98rem;
    }

    .game-board {
        grid-template-columns: repeat(4, 72px);
        gap: 10px;
    }

    .card {
        width: 72px;
        height: 72px;
        font-size: 21px;
        border-radius: 14px;
    }

    .home-btn {
        top: 12px;
        left: 12px;
        padding: 8px 13px;
        font-size: 0.92rem;
    }

    .board-wrap {
        padding: 16px 12px 22px;
    }
}
</style>
</head>

<body>

<div class="sakura-container">
    <div class="sakura">🌸</div>
    <div class="sakura">🌸</div>
    <div class="sakura">🌸</div>
    <div class="sakura">🌸</div>
    <div class="sakura">🌸</div>
    <div class="sakura">🌸</div>
    <div class="sakura">🌸</div>
    <div class="sakura">🌸</div>
    <div class="sakura">🌸</div>
    <div class="sakura">🌸</div>
    <div class="sakura">🌸</div>
    <div class="sakura">🌸</div>
</div>

<a href="index.html" class="home-btn">🏠 回首頁</a>

<div class="page-wrap">
    <div class="header-box">
        <h1>日本語平假名大挑戰</h1>
        <p class="subtitle">翻牌配對學習日文平假名，從「あ・い・う・え・お」開始，輕鬆挑戰基礎發音記憶。</p>
    </div>

    <div class="info-panel">
        <div class="info-box">⏱ 時間：<span id="timer">0</span> 秒</div>
        <div class="control-box">
            <button onclick="startGame()">重新開始</button>
        </div>
    </div>

    <div class="board-wrap">
        <div class="game-board" id="board"></div>
        <div class="tip">請點選卡片，找出正確的平假名與羅馬拼音配對。</div>
    </div>
</div>

<script>
const pairs = [
    ["あ", "a"],
    ["い", "i"],
    ["う", "u"],
    ["え", "e"],
    ["お", "o"],
    ["か", "ka"],
    ["き", "ki"],
    ["く", "ku"]
];

let cards = [];
let first = null;
let second = null;
let lock = false;
let matchedCount = 0;

let timer = 0;
let timerInterval = null;
let gameStarted = false;

const board = document.getElementById("board");
const timerDisplay = document.getElementById("timer");

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(() => {
        timer++;
        timerDisplay.textContent = timer;
    }, 1000);
}

function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

function createCards() {
    cards = [];
    pairs.forEach(pair => {
        cards.push({ text: pair[0], match: pair[1] });
        cards.push({ text: pair[1], match: pair[0] });
    });
    shuffle(cards);
}

function startGame() {
    stopTimer();
    timer = 0;
    timerDisplay.textContent = timer;
    gameStarted = false;

    first = null;
    second = null;
    lock = false;
    matchedCount = 0;

    board.innerHTML = "";
    createCards();

    cards.forEach(cardData => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.text = cardData.text;
        card.dataset.match = cardData.match;
        card.textContent = "";

        card.addEventListener("click", () => handleCardClick(card));
        board.appendChild(card);
    });
}

function handleCardClick(card) {
    if (lock) return;
    if (card.classList.contains("flipped")) return;
    if (card.classList.contains("matched")) return;

    if (!gameStarted) {
        gameStarted = true;
        startTimer();
    }

    card.textContent = card.dataset.text;
    card.classList.add("flipped");

    if (!first) {
        first = card;
        return;
    }

    second = card;
    lock = true;

    setTimeout(() => {
        if (first.dataset.match === second.dataset.text) {
            first.classList.remove("flipped");
            second.classList.remove("flipped");
            first.classList.add("matched");
            second.classList.add("matched");
            matchedCount += 2;
        } else {
            first.textContent = "";
            second.textContent = "";
            first.classList.remove("flipped");
            second.classList.remove("flipped");
        }

        first = null;
        second = null;
        lock = false;

        checkWin();
    }, 700);
}

function checkWin() {
    if (matchedCount === cards.length) {
        stopTimer();
        setTimeout(() => {
            alert(`恭喜完成！你花了 ${timer} 秒`);
        }, 200);
    }
}

startGame();
</script>

</body>
</html>

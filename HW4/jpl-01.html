<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語平假名大挑戰</title>

<style>
body {
    font-family: "Noto Sans JP", Arial, sans-serif;
    text-align: center;
    background: #0b1d3a;
    margin: 0;
    padding: 20px;
    color: #ffffff;
}

/* 大標題 */
h1 {
    font-size: 42px;
    letter-spacing: 4px;
    margin-top: 10px;
    margin-bottom: 5px;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
}

.subtitle {
    margin-bottom: 15px;
    color: #d6e4ff;
}

.info {
    margin: 10px 0 15px;
    font-size: 20px;
    color: #ffd700;
}

button {
    padding: 10px 18px;
    font-size: 16px;
    border: 2px solid #ffd700;
    border-radius: 8px;
    cursor: pointer;
    background: transparent;
    color: #ffd700;
    margin-bottom: 20px;
}

button:hover {
    background: #ffd700;
    color: #0b1d3a;
}

.game-board {
    display: grid;
    grid-template-columns: repeat(4, 110px);
    gap: 12px;
    justify-content: center;
    margin: 0 auto;
}

.card {
    width: 110px;
    height: 110px;
    background: #122a52;
    color: white;
    font-size: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    border-radius: 10px;
    border: 3px solid #ffd700;
    user-select: none;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.05);
}

.card.flipped,
.card.matched {
    background: #ffffff;
    color: #0b1d3a;
}

.card.matched {
    background: #fff5cc;
    cursor: default;
}

@media (max-width: 520px) {
    .game-board {
        grid-template-columns: repeat(4, 70px);
    }

    .card {
        width: 70px;
        height: 70px;
        font-size: 20px;
    }

    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>
<a href="index.html" class="back-btn">← 回首頁</a>

<style>
.back-btn{
  display:inline-block;
  margin-bottom:20px;
  padding:8px 16px;
  background:#2c3e50;
  color:white;
  border-radius:8px;
  text-decoration:none;
  font-size:14px;
}

.back-btn:hover{
  background:#34495e;
}
</style>
<h1>日本語平假名大挑戰</h1>
<div class="subtitle">翻牌配對學習日文平假名</div>

<div class="info">
⏱ 時間：<span id="timer">0</span> 秒
</div>

<button onclick="startGame()">重新開始</button>

<div class="game-board" id="board"></div>

<script>
const pairs = [
    ["あ", "a"],
    ["い", "i"],
    ["う", "u"],
    ["え", "e"],
    ["お", "o"],
    ["か", "ka"],
    ["き", "ki"],
    ["く", "ku"]
];

let cards = [];
let first = null;
let second = null;
let lock = false;
let matchedCount = 0;

let timer = 0;
let timerInterval = null;
let gameStarted = false;

const board = document.getElementById("board");
const timerDisplay = document.getElementById("timer");

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(() => {
        timer++;
        timerDisplay.textContent = timer;
    }, 1000);
}

function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

function createCards() {
    cards = [];
    pairs.forEach(pair => {
        cards.push({ text: pair[0], match: pair[1] });
        cards.push({ text: pair[1], match: pair[0] });
    });
    shuffle(cards);
}

function startGame() {
    stopTimer();
    timer = 0;
    timerDisplay.textContent = timer;
    gameStarted = false;

    first = null;
    second = null;
    lock = false;
    matchedCount = 0;

    board.innerHTML = "";
    createCards();

    cards.forEach(cardData => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.text = cardData.text;
        card.dataset.match = cardData.match;

        card.addEventListener("click", () => handleCardClick(card));
        board.appendChild(card);
    });
}

function handleCardClick(card) {
    if (lock) return;
    if (card.classList.contains("flipped")) return;
    if (card.classList.contains("matched")) return;

    if (!gameStarted) {
        gameStarted = true;
        startTimer();
    }

    card.textContent = card.dataset.text;
    card.classList.add("flipped");

    if (!first) {
        first = card;
        return;
    }

    second = card;
    lock = true;

    setTimeout(() => {
        if (first.dataset.match === second.dataset.text) {
            first.classList.remove("flipped");
            second.classList.remove("flipped");
            first.classList.add("matched");
            second.classList.add("matched");
            matchedCount += 2;
        } else {
            first.textContent = "";
            second.textContent = "";
            first.classList.remove("flipped");
            second.classList.remove("flipped");
        }

        first = null;
        second = null;
        lock = false;

        checkWin();
    }, 700);
}

function checkWin() {
    if (matchedCount === cards.length) {
        stopTimer();
        setTimeout(() => {
            alert(`恭喜完成！你花了 ${timer} 秒`);
        }, 200);
    }
}

startGame();
</script>

</body>
</html>
